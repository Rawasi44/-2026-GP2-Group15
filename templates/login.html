{% extends "base.html" %}

{% block content %}
<style>
  /* Page-specific: not part of the shared auth component set in style.css */
  .forgot-password {
    text-align: right;
    margin-top: 10px;
    margin-bottom: 10px;
  }

  .forgot-password a {
    font-size: 0.9rem;
    color: var(--accent-dark);
    text-decoration: none;
    font-weight: 600;
  }

  .forgot-password a:hover {
    text-decoration: underline;
  }
</style>

<div class="auth-page hide-auth-buttons">
  <div class="login-card">
    <h2 class="login-title">Login</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="auth-flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login') }}">
      <input 
        type="email" 
        name="email" 
        class="login-input" 
        placeholder="Email" 
        required
      >

      <input 
        type="password" 
        name="password" 
        class="login-input" 
        placeholder="Password" 
        required
      >

      <!-- Forgot Password -->
      <div class="forgot-password">
        <a href="{{ url_for('auth.forgot_password') }}">
          Forgot Password?
        </a>
      </div>

      <button type="submit" class="login-btn-main">
        Login
      </button>
    </form>

    <p class="signup-question">
      Are you a new user?
      <a href="{{ url_for('auth.signup') }}">Sign Up</a>
    </p>
  </div>
</div>

{% endblock %}
